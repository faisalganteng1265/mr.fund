[package]
name = "guardian"
description = "Owner-controlled Guardian policy and reserve lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
near-sys = "=0.4.0"
guardian-types = { path = "../guardian-types" }
protocol-trigger = { path = "../protocol-trigger" }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
