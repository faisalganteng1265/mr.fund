[package]
name = "guardian-factory"
description = "Keyless per-owner Guardian provisioning (embedded Guardian code, atomic creation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
guardian-types = { path = "../guardian-types" }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
