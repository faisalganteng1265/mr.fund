[package]
name = "probe"
description = "Throwaway owner-gated Rhea integration probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
# 0.4.1 feature-gates symbols used unconditionally by near-sdk 5.30.0.
near-sys = "=0.4.0"
protocol-trigger = { path = "../protocol-trigger" }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
