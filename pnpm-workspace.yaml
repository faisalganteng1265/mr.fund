packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.5"
  - "@biomejs/cli-android-arm64@2.6.5"
  - "@biomejs/cli-android-x64@2.6.5"
  - "@biomejs/cli-darwin-arm64@2.6.5"
  - "@biomejs/cli-darwin-x64@2.6.5"
  - "@biomejs/cli-linux-arm64-musl@2.6.5"
  - "@biomejs/cli-linux-arm64@2.6.5"
  - "@biomejs/cli-linux-x64-musl@2.6.5"
  - "@biomejs/cli-linux-x64@2.6.5"
  - "@biomejs/cli-win32-arm64@2.6.5"
  - "@biomejs/cli-win32-x64@2.6.5"
# Reviewed: this dependency's postinstall prints sponsorship text only.
# Browser artifacts are already shipped; do not execute scripts or import SDK agent skills.
permissions:
  browser-tabs-lock:
    build: false
  "@hot-labs/near-connect":
    skills: false
  esbuild:
    build: false
